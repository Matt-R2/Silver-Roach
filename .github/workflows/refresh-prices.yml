name: Refresh spot prices

on:
  schedule:
    - cron: "0 0,3,6,9,12,15,18,21 * * *" # every 90 minutes (UTC), part 1 of 2
    - cron: "30 1,4,7,10,13,16,19,22 * * *" # every 90 minutes (UTC), part 2 of 2
  workflow_dispatch: {} # allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call refresh-prices endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/refresh-prices")
          cat /tmp/response.json
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Request failed with status $response"
            exit 1
          fi

      - name: Call check-alerts endpoint
        run: |
          response=$(curl -s -o /tmp/alerts-response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/check-alerts")
          cat /tmp/alerts-response.json
          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Request failed with status $response"
            exit 1
          fi
